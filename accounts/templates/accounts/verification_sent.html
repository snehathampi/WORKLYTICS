<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verification Sent | Worklytics</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .verification-container { max-width: 500px; margin: 100px auto; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h2 { color: #1f2a44; margin-bottom: 20px; }
        p { color: #6b7a99; line-height: 1.6; margin-bottom: 30px; }
        .btn { display: inline-block; padding: 12px 30px; background: #5b7cff; color: white; text-decoration: none; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="verification-container">
        <div class="icon">📧</div>
        <h2>Verification Email Sent</h2>
        <p>We've sent a verification link to your email address. Please check your inbox and click the link to verify your account.</p>
        <p style="font-size: 14px;">If you don't see the email, check your spam folder.</p>
        <a href="{% url 'login' %}" class="btn">Go to Login</a>
    </div>
</body>
</html>
